server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # ============================================
  # 📦 Static Assets (CSS, JS, Images, Fonts)
  # ============================================
  location /assets/ {
    # Serve static files directly, no fallback
    try_files $uri =404;
    
    # Enable caching for assets
    expires 1y;
    add_header Cache-Control "public, immutable";
    
    # Ensure correct MIME types
    include /etc/nginx/mime.types;
  }

  # ============================================
  # 🔌 API Proxy to Backend
  # ============================================
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ============================================
  # 🖼️ Uploads Proxy (Proxy to Backend)
  # ============================================
  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ============================================
  # 🌐 SPA Routing (Vue Router)
  # ============================================
  location / {
    # For SPA: serve index.html for non-existent routes
    try_files $uri $uri/ /index.html;
  }

  # ============================================
  # 🔥 Service Worker & Manifest
  # ============================================
  location ~ ^/(firebase-messaging-sw\.js|manifest\.json|sw\.js)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  # ============================================
  # 🖼️ Favicon & Static Root Files
  # ============================================
  location ~ \.(ico|png|svg|webp|jpg|jpeg)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
  }
}