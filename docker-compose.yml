services:
  frontend:
    container_name: ecobank-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - DOCKER=true
      - VITE_API_BASE_URL=http://localhost:3001
      - VITE_APP_TITLE=EcoBank
    command: npm run dev
    depends_on:
      - backend
    networks:
      - ecobank_net

  backend:
    container_name: ecobank-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ecobank_uploads:/app/uploads
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://root:example@mongodb:27017/ecobank?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: npm run dev
    depends_on:
      - mongodb
    networks:
      - ecobank_net

  mongodb:
    image: mongo:7
    container_name: ecobank-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27018:27017"
    volumes:
      - ecobank_mongo_data:/data/db
    networks:
      - ecobank_net

volumes:
  ecobank_mongo_data:
  ecobank_uploads:

networks:
  ecobank_net:
    driver: bridge
