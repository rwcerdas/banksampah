services:
  frontend:
    container_name: ecobank-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Hanya localhost — nginx di host yang expose 80/443 ke publik
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    environment:
      # Kosong = same-origin (https://domain/api → proxy di nginx container)
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-EcoBank}
    networks:
      - ecobank_net
    restart: unless-stopped

  backend:
    container_name: ecobank-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Tidak publish port ke host — akses hanya lewat jaringan Docker (frontend nginx)
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongodb:27017/ecobank?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: npm start
    volumes:
      - ecobank_uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - ecobank_net
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ecobank-mongodb-prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - ecobank_mongo_data:/data/db
    networks:
      - ecobank_net
    restart: unless-stopped

volumes:
  ecobank_mongo_data:
  ecobank_uploads:

networks:
  ecobank_net:
    driver: bridge
